name: Android media E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: android-media-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-e2e:
    name: Android media E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: "true"
      SYMPOSIUM_ANDROID_E2E_REQUIRE_OUTBOUND_AUDIO: "false"
      TELEMETRY_ENDPOINT: ""
      TELEMETRY_TOKEN: ""

    steps:
      - name: Check out Android source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test relay lock tooling
        run: scripts/test-relay-tools.sh

      - name: Check out relay source pinned by relay.lock.json
        run: python3 scripts/relay-source.py fetch .relay-work/source

      - name: Set up Go from locked relay
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .relay-work/source/go.mod
          cache: false

      - name: Test relay source build safeguards
        run: python3 scripts/test-relay-source.py

      - name: Download locked Go module sources
        run: python3 scripts/relay-source.py download-deps .relay-work/source

      - name: Build bundled relay from verified source without network downloads
        run: python3 scripts/relay-source.py build .relay-work/source

      - name: Use the source-built relay in media tests
        run: |
          echo "SYMPOSIUM_RELAY_DIR=$GITHUB_WORKSPACE/.relay-work/source" >>"$GITHUB_ENV"
          echo "SYMPOSIUM_RELAY_REVISION=$(jq -er '.source_revision' relay.lock.json)" >>"$GITHUB_ENV"
          echo "SYMPOSIUM_E2E_RELAY_MODE=bundled" >>"$GITHUB_ENV"

      - name: Run Android emulator media E2E
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: ./scripts/android-media-e2e.sh
