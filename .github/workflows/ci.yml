name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: "true"
      ANDROID_KEYSTORE_PATH: ""
      ANDROID_KEYSTORE_PASSWORD: ""
      ANDROID_KEY_ALIAS: ""
      ANDROID_KEY_PASSWORD: ""
      SYMPOSIUM_REQUIRE_RELEASE_SIGNING: "false"
      TELEMETRY_ENDPOINT: ""
      TELEMETRY_TOKEN: ""

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test relay lock tooling
        run: scripts/test-relay-tools.sh

      - name: Check out relay source pinned by relay.lock.json
        run: python3 scripts/relay-source.py fetch .relay-work/source

      - name: Set up Go from locked relay
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .relay-work/source/go.mod
          cache: false

      - name: Test relay source build safeguards
        run: python3 scripts/test-relay-source.py

      - name: Download locked Go module sources
        run: python3 scripts/relay-source.py download-deps .relay-work/source

      - name: Build bundled relay from verified source without network downloads
        run: python3 scripts/relay-source.py build .relay-work/source

      - name: Detect relay lock changes
        id: relay_lock
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          changed=false
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            push) base_sha="$BEFORE_SHA" ;;
            workflow_dispatch)
              changed=true
              base_sha=""
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ "$changed" == "false" ]]; then
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$base_sha" =~ ^0{40}$ ]] ||
               ! git cat-file -e "${base_sha}^{commit}"; then
              changed=true
            elif ! git diff --quiet "$base_sha" "$GITHUB_SHA" -- relay.lock.json; then
              changed=true
            fi
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

      - name: Verify changed relay provenance
        if: steps.relay_lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-relay-provenance.sh --download

      - name: Run unit tests
        run: ./gradlew --no-daemon --dependency-verification strict :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon --dependency-verification strict :app:lintDebug

      - name: Build debug and unsigned release variants
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          :app:assembleDebug :app:assembleRelease
